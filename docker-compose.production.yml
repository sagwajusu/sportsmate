name: sportsmate

services:
  backend:
    image: carrotkang/sportsmate-backend:latest
    env_file:
      - ./backend/.env
    expose:
      - "5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - sportsmate

  frontend:
    image: carrotkang/sportsmate-frontend:latest
    ports:
      - "127.0.0.1:${FRONTEND_PROXY_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sportsmate

networks:
  sportsmate:
    driver: bridge
